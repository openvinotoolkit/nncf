    "src/nncf/quantization/algorithms/weight_compression/algorithm.py",
    "src/nncf/quantization/algorithms/weight_compression/awq.py",
    "src/nncf/quantization/algorithms/weight_compression/awq_patterns.py",
    "src/nncf/quantization/algorithms/weight_compression/backend.py",
    "src/nncf/quantization/algorithms/weight_compression/fp8_conversion.py",
    "src/nncf/quantization/algorithms/weight_compression/gptq.py",
    "src/nncf/quantization/algorithms/weight_compression/lora_correction.py",
    "src/nncf/quantization/algorithms/weight_compression/mixed_precision.py",
    "src/nncf/quantization/algorithms/weight_compression/onnx_backend.py",
    "src/nncf/quantization/algorithms/weight_compression/openvino_backend.py",
    "src/nncf/quantization/algorithms/weight_compression/parameters.py",
    "src/nncf/quantization/algorithms/weight_compression/scale_estimation.py",
    "src/nncf/quantization/algorithms/weight_compression/torch_backend.py",
    "src/nncf/quantization/algorithms/weight_compression/torch_fx_backend.py",
    "src/nncf/quantization/algorithms/weight_compression/weight_lowering.py",
    "src/nncf/torch/__init__.py",
    "src/nncf/torch/graph/operator_metatypes.py",
    "src/nncf/torch/graph/transformations/commands.py",
    "src/nncf/torch/initialization.py",
    "src/nncf/torch/model_graph_manager.py",
    "src/nncf/torch/quantization/layers.py",
    "src/nncf/torch/quantization/quantize_functions.py",
    "src/nncf/torch/quantization/reference.py",
    "src/nncf/torch/quantization/strip.py",
    "src/nncf/torch/return_types.py",
]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "nncf.tensor.functions.*"
disable_error_code = ["empty-body", "no-any-return"]

[[tool.mypy.overrides]]
module = ["transformers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
exclude = ["src/nncf/torch/function_hook/handle_inner_functions.py"]

[tool.ruff.lint]
preview = true
ignore = [
    "E203",    # whitespace-before-punctuation
    "E251",    # unexpected-spaces-around-keyword-parameter-equals
    "E731",    # lambda-assignment
    "SIM108",  # if-else-block-instead-of-if-exp
    "SIM110",  # reimplemented-builtin
    "SIM117",  # multiple-with-statements
    "SIM103",  # needless-bool
    "NPY002",  # numpy-legacy-random
    "UP035",   # deprecated-import
    "D100",    # undocumented-public-module
    "D101",    # undocumented-public-class
    "D102",    # undocumented-public-method
    "D103",    # undocumented-public-function
    "D104",    # undocumented-public-package
    "D105",    # undocumented-magic-method
    "D106",    # undocumented-public-nested-class
    "D107",    # undocumented-public-init
    "D200",    # unnecessary-multiline-docstring
    "D203",    # incorrect-blank-line-before-class
    "D205",    # missing-blank-line-after-summary
    "D212",    # multi-line-summary-first-line
    "D400",    # missing-trailing-period
    "D401",    # non-imperative-mood
    "D402",    # signature-in-docstring
    "D404",    # docstring-starts-with-this
    "D413",    # missing-blank-line-after-last-section
    "D415",    # missing-terminal-punctuation
    "D417",    # undocumented-param
    "PERF203", # try-except-in-loop
    "PERF401", # manual-list-comprehension
    "PERF403", # manual-dict-comprehension
    "B905",    # zip-without-explicit-strict
    "RET502",  # implicit-return-value
    "RET503",  # implicit-return
    "RET504",  # unnecessary-assign
    "TD003",   # todo-missing-issue
]
select = [
    "CPY001", # copyright check
    "D",      # pydocstyle
    "E",      # pycodestyle rules
    "EM",     # flake8-errmsg
    "F",      # pyflakes rules
    "I",      # isort
    "INP",    # flake8-no-pep420
    "ISC",    # flake8-implicit-str-concat
    "NPY",    # numpy rules
    "UP",     # pyupgrade
    "PERF",   # perflint
    "B",      # flake8-bugbear
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "TD",     # flake8-todos
]
extend-select = [
    "SIM", # https://pypi.org/project/flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"src/nncf/torch/__init__.py" = ["F401", "E402"]
"tests/**/*.py" = ["F403"]
"tests/**/__init__.py" = ["F401"]
"examples/**/*.py" = ["F403"]
"!src/nncf/**.py" = ["INP", "D", "B", "PTH"]
"*.ipynb" = ["CPY001"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = """\
# Copyright \\(c\\) (202[6,7]) Intel Corporation
# Licensed under the Apache License, Version 2.0 \\(the "License"\\);
# you may not use this file except in compliance with the License.
# You may obtain a copy of the License at
#      http://www.apache.org/licenses/LICENSE-2.0
# Unless required by applicable law or agreed to in writing, software
# distributed under the License is distributed on an "AS IS" BASIS,
# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
# See the License for the specific language governing permissions and
# limitations under the License.
"""

[tool.ruff.lint.isort]
force-single-line = true
known-third-party = ["datasets"]
single-line-exclusions = ["typing"]

[tool.pytest.ini_options]
pythonpath = "."

[tool.bandit]
exclude_dirs = ["tools", "tests", "**/venv*", "build"]
skips = [
    "B101", # assert_used
    "B404", # import_subprocess
    "B614", # pytorch_load
    "B615", # huggingface_unsafe_download
]
