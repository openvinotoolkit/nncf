name: Reusable Test Summary
permissions: read-all

on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: 'Pattern to match test artifacts'
        required: true
        type: string

jobs:
  generate-summary:
    name: Summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/pytest_md_summary.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: test-results
      - name: Test Summary
        run: |
          pip install defusedxml==0.7.1
          python .github/scripts/pytest_md_summary.py test-results >> "$GITHUB_STEP_SUMMARY"
