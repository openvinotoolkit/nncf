name: MacOS
run-name: "MacOS${{ inputs.pr_num != '' && format(' PR#{0}', inputs.pr_num) || '' }}"
permissions: read-all

on:
  workflow_call:
    inputs:
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''

env:
  UV_SYSTEM_PYTHON: 'true'
  PYTHON_VERSION: "3.12"

jobs:
  precommit:
    name: precommit-${{ matrix.scope }}
    runs-on: macos-14
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: common
            install: install-common
            test: test-common
            workers: 2
          - scope: openvino
            install: install-openvino
            test: test-openvino
            workers: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install NNCF and test requirements
        run: make ${{ matrix.install }}
      - name: Print installed modules
        run: pip list
      - name: Run precommit test scope
        run: make ${{ matrix.test }}
