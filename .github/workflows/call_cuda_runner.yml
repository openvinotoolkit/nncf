name: call-cuda-runner
permissions: read-all

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version'
        type: string
        required: true
      override_requirements:
        description: 'Override requirements'
        default: ''
        type: string
        required: false

jobs:
  build_docker:
    uses: ./.github/workflows/call_build_docker.yml
    with:
      images: |
        nncf/pytorch_cuda

  pytorch-cuda:
    timeout-minutes: 40
    needs: build_docker
    runs-on:
      group: Nvidia-GPU
      labels: [Linux, NNCF]
    container:
      image: ${{ fromJSON(needs.build_docker.outputs.images).nncf.pytorch_cuda }}
      options: --gpus all --ipc=host
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
        - /opt/home/actions_runner/actions-runner/pip-cache:/opt/pip-cache
      env:
        PIP_CACHE_DIR: /opt/pip-cache
    defaults:
      run:
        shell: bash
    steps:
      - name: Update CA certificates
        run: update-ca-certificates

      - name: Runner info
        continue-on-error: true
        run: |
          nvidia-smi
          cat /proc/cpuinfo

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Register toolcache libpython with the dynamic linker
        run: |
          echo "$pythonLocation/lib" > /etc/ld.so.conf.d/zz-python-toolcache.conf
          ldconfig

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Override constraints
        if: ${{ inputs.override_requirements != '' }}
        run: python .github/scripts/override_constraints.py "${{ inputs.override_requirements }}"
        shell: bash

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install NNCF and test requirements
        run: UV_CONCURRENT_DOWNLOADS=2 uv pip install . -r tests/torch/requirements.txt

      - name: Print installed modules
        run: pip list

      - name: Check CUDA
        run: |
          python -c "import torch; print(torch.cuda.is_available())"

      - name: Run PyTorch precommit test scope
        run: |
          pytest -ra --durations=30 tests/torch -m cuda
