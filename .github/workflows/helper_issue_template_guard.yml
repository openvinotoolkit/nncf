name: Issue Template Guard

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: AlexanderDokuchaev/issue-template-guard@test
        with:
          label_name: template-missing
          message: |
            Thanks for opening this issue :wave:

            This issue does not follow our issue template. Please edit it and
            fill in every required section from the template.

            Please read for more information:
                - [Contribution Guidelines](https://github.com/openvinotoolkit/nncf/blob/develop/CONTRIBUTING.md)
                - [AI Policy](https://github.com/openvinotoolkit/nncf/blob/develop/AI_POLICY.md)
