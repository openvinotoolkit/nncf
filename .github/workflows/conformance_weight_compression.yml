name: Conformance WC
run-name: "Conformance WC${{ inputs.pr_num != '' && format(' PR#{0}', inputs.pr_num) || '' }}${{ inputs.pytest_args != '' && format(' [{0}]', inputs.pytest_args) || '' }}"
permissions: read-all

on:
  workflow_call:
    inputs:
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''
      pytest_args:
        description: 'Pytest arguments'
        type: string
        default: ''
    secrets:
      HF_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''
      pytest_args:
        description: 'Pytest arguments'
        type: string
        default: ''

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  PYTEST_ARGS: ${{ inputs.pytest_args || '' }}
  TQDM_DISABLE: 1
  RESULT_XML: "pytest-results.xml"
  HOME_HF: "/home/runner/hf_home"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  UV_SYSTEM_PYTHON: 'true'
  DEBIAN_FRONTEND: noninteractive

jobs:
  conformance-wc:
    name: Conformance WC [${{ matrix.group }}/6]
    runs-on: aks-linux-16-cores-32gb
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1 ] #, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - name: Install dependencies
        run: |
          apt-get update
          apt-get --assume-yes install build-essential ninja-build libgl1-mesa-dev libglib2.0-0 wget make

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install NNCF and test requirements
        run: make install-conformance
      - name: Print installed modules
        run: pip list
      - name: Run wc test scope
        run: |
          set +e
          make test-wc ARGS="--junit-xml=${RESULT_XML} \
            --durations-path=tests/post_training/data/wc_test_durations.json \
            --splitting-algorithm=least_duration \
            --splits 8 \
            --group ${{ matrix.group }} \
            ${PYTEST_ARGS}"
          ret=$?
          [ $ret -eq 5 ] && [ -n "${{ env.PYTEST_ARGS }}" ]  && exit 0 || exit $ret
      - name: Print results.csv
        if: ${{ !cancelled() }}
        run: column -s, -t < tmp/results.csv || echo "no file"
      - name: Upload artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: wc_results_${{ matrix.group }}
          path: tmp/results.csv
          if-no-files-found: ignore

  combine-csv:
    name: Combined CSV results
    if: ${{ !cancelled() }}
    needs: conformance-wc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wc_results_*
          path: wc-results
      - name: Combine and print results
        run: |
          shopt -s nullglob
          files=(wc-results/wc_results_*/results.csv)
          if (( ${#files[@]} == 0 )); then
            echo 'No WC results.csv files were uploaded.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          head -n 1 "${files[0]}" > combined-results.csv
          for file in "${files[@]}"; do
            tail -n +2 "$file"
          done | LC_ALL=C sort -t, -k1,1 -k2,2 >> combined-results.csv
          {
            echo '### WC results'
            echo '```text'
            column -s, -t < combined-results.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined results
        if: ${{ hashFiles('combined-results.csv') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wc-results-combined
          path: combined-results.csv
