name: Test install
run-name: "Test install${{ inputs.pr_num != '' && format(' PR#{0}', inputs.pr_num) || '' }}"
permissions: read-all

on:
  workflow_call:
    inputs:
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      pr_num:
        description: 'The pull request number'
        default: ''

jobs:
  install-cpu:
    name: Test install [${{ matrix.backend }} - ${{ matrix.runner }}]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend:  ["torch", "onnx", "openvino"]
        runner: ["windows-latest", "ubuntu-latest"]
    defaults:
      run:
        shell: bash
    steps:
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          pip install -r tests/cross_fw/examples/requirements.txt
      - name: Print installed modules
        run: pip list
      - name: Run install test scope
        run: pytest tests/cross_fw/install -rA -s --host-configuration cpu --backend ${{ matrix.backend }}

  install-torch-gpu:
    name: Test install [torch - ubuntu-gpu]
    defaults:
      run:
        shell: bash
    runs-on: aks-linux-6-cores-55gb-gpu-a10
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run : |
          sudo apt-get update
          sudo apt-get --assume-yes install build-essential ninja-build libgl1-mesa-dev libglib2.0-0 wget make virtualenv
      - name: Download CUDA
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/13.2.1/local_installers/cuda_13.2.1_595.58.03_linux.run
          sudo sh cuda_13.2.1_595.58.03_linux.run --toolkit --silent
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - name: GPU Info
        run: nvidia-smi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: |
          pip install -r tests/cross_fw/examples/requirements.txt
      - name: Print installed modules
        run: pip list
      - name: Run install test scope
        run: |
          pytest tests/cross_fw/install -rA -s --host-configuration gpu --backend torch
