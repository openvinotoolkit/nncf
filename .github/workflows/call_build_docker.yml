name: build-docker
permissions: read-all

on:
  workflow_call:
    inputs:
      images:
        description: 'Newline-separated list of images to build (relative to dockerfiles_root_dir)'
        type: string
        required: true
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''
    outputs:
      images:
        description: 'JSON map of resolved image references'
        value: ${{ jobs.build_docker.outputs.images }}

jobs:
  build_docker:
    name: Docker
    timeout-minutes: 15
    concurrency:
      group: build_docker
      cancel-in-progress: false
    runs-on: aks-linux-4-cores-16gb-docker-build
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
        - /mount:/mount
    outputs:
      images: "${{ steps.handle_docker.outputs.images }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}

      - name: Check for dockerfile changes
        id: check_docker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          if [ -z "$BASE_SHA" ]; then
            # No PR context (e.g. scheduled run): nothing to diff, reuse existing images.
            dockerfiles=false
            docker_env=false
          else
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .github/dockerfiles; then
              dockerfiles=false
            else
              dockerfiles=true
            fi
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- .dockerignore .github/dockerfiles; then
              docker_env=false
            else
              docker_env=true
            fi
          fi

          echo "changed_components={\"docker_env\": $docker_env, \"dockerfiles\": $dockerfiles}" >> "$GITHUB_OUTPUT"

      - uses: openvinotoolkit/openvino/.github/actions/handle_docker@1f6bb04df50d71dd7e392537eee6b834312f269a
        id: handle_docker
        with:
          images: ${{ inputs.images }}
          registry: 'openvinogithubactions.azurecr.io'
          dockerfiles_root_dir: '.github/dockerfiles'
          changed_components: ${{ steps.check_docker.outputs.changed_components }}
