name: sdl
permissions: read-all

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - develop
      - release_v*
  pull_request:

jobs:
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit[toml]==1.9.2
      - name: Run bandit
        run: bandit -c pyproject.toml -r .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:python"

      # pdf reports always empty for pull_request
      - name: Generate Security Report
        if: ${{ github.event_name != 'pull_request' }}
        uses: rsdmike/github-security-report-action@a3d8cc051bc89f1b622d396adab901aa73857a29 # v4.1.0
        with:
          template: report
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Report
        shell: bash
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          REF_NAME="${{ github.ref_name }}"
          mv "report.pdf" "codeql_nncf_report_${DATE}_${REF_NAME//\//-}_${{ github.sha }}.pdf"
      - name: Upload CodeQL Artifacts
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: codeql-scan-results
          path: "./codeql*.pdf"

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on PRs and develop pushes to avoid blocking merges by vulnerabilities found in requirements
    if: >-
      ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'release_v')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: .
          scanners: "misconfig,license,vuln"
          format: json
          output: trivy_report.json
          cache: false
          hide-progress: true
          exit-code: 1
      - name: Convert Report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          trivy convert --format template --template "@.github/scripts/trivy_html.tpl" \
            --output trivy_report.html trivy_report.json
          trivy convert --format table --scanners misconfig,license,vuln \
            --output trivy_report.txt trivy_report.json
      - name: Print Scan Results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cat trivy_report.txt
          ROWS=$(jq -r '
            [.Results[]? | .Target as $target | .Vulnerabilities[]? | . + {Target: $target}]
            | group_by([.Target, .PkgName, .InstalledVersion])[]
            | "| \(.[0].Target) | \(.[0].PkgName) | \(.[0].InstalledVersion) "
              + "| \([.[].FixedVersion // empty | select(. != "")] | unique | join(", ")) "
              + "| \([.[] | "\(.VulnerabilityID) (\(.Severity))"] | unique | join(", ")) |"
          ' trivy_report.json)
          {
            echo "## Trivy: packages to update"
            if [[ -z "$ROWS" ]]; then
              echo "No vulnerable packages found."
            else
              echo "| Target | Package | Installed | Fixed in | Vulnerabilities |"
              echo "|---|---|---|---|---|"
              echo "$ROWS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rename Report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          DATE=$(date +"%Y-%m-%d")
          REF_NAME="${{ github.ref_name }}"
          mv "trivy_report.html" "trivy_report_${DATE}_${REF_NAME//\//-}_${{ github.sha }}.html"
      - name: Upload Scan Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: trivy-report
          path: "./trivy_report*.html"
          retention-days: 30

  antivirus:
    name: Antivirus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Get changed files
        if: ${{ github.event_name == 'pull_request' }}
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      - name: Run ClamAV scan
        id: run-clamav
        uses: docker://clamav/clamav:stable
        with:
          entrypoint: sh
          args: |
            -cx "
            # Update virus definitions
            freshclam --quiet

            # Run scan based on scope
            if [ '${{ github.event_name == 'pull_request' }}' = 'true' ] && [ -n '${{ steps.changed-files.outputs.all_changed_files }}' ]; then
              echo 'Running ClamAV on changed files'
              SCAN_ARGS='${{ steps.changed-files.outputs.all_changed_files }}'
            else
              echo 'Running ClamAV on all files'
              SCAN_ARGS='-r'
            fi

            # Run scan and capture output
            clamscan $SCAN_ARGS > clamav_report.txt
            "
      - name: Print Scan Results
        if: ${{ !cancelled() }}
        shell: bash
        run: cat clamav_report.txt
      - name: Rename Report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          DATE=$(date +"%Y-%m-%d")
          REF_NAME="${{ github.ref_name }}"
          mv "clamav_report.txt" "clamav_report_${DATE}_${REF_NAME//\//-}_${{ github.sha }}.txt"
      - name: Upload Scan Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: clamav-report
          path: "./clamav_report*.txt"
          retention-days: 30
