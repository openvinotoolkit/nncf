name: "[Schedule] Weekly - OpenVino DEV"
run-name: "[Schedule] Weekly - OpenVino DEV${{ inputs.pr_num != '' && format(' PR#{0}', inputs.pr_num) || '' }}"
permissions: read-all

on:
  workflow_dispatch:
    inputs:
      pr_num:
        description: 'The pull request number'
        default: ''
  schedule:
    - cron: '0 0 * * 0'
  pull_request:

env:
  UV_SYSTEM_PYTHON: 'true'
  UV_EXTRA_INDEX_URL: https://storage.openvinotoolkit.org/simple/wheels/nightly
  UV_INDEX_STRATEGY: "unsafe-best-match"

jobs:
  openvino:
    if: github.repository_owner == 'openvinotoolkit'
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 40
    env:
      NUM_WORKERS: 4
    steps:
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Allow nightly OpenVINO
        run: python .github/scripts/override_constraints.py 'openvino>=0'
      - name: Install NNCF and OpenVINO test requirements
        run: make install-openvino
      - name: Print installed modules
        run: pip list
      - name: Summarize OpenVINO version
        run: |
          {
            printf '### OpenVINO install command\n\n```text\n'
            printf 'pip install --extra-index-url https://storage.openvinotoolkit.org/simple/wheels/nightly \\\n'
            printf '  openvino==%s \\\n' "$(pip list | awk '$1 == "openvino" {print $2}')"
            printf '  openvino-tokenizers==%s\n' "$(pip list | awk '$1 == "openvino-tokenizers" {print $2}')"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      # - name: Run OpenVINO tests
      #   run: make test-openvino
