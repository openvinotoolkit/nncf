name: call-precommit
permissions: read-all

on:
  workflow_call:
    inputs:
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''
      python_version:
        description: 'Python version'
        type: string
        required: true
      gpu_enabled:
        description: 'Enable gpu tests'
        type: boolean
        default: false
      override_requirements:
        description: 'Override requirements'
        default: ''
        type: string
        required: false

env:
  UV_SYSTEM_PYTHON: 'true'

defaults:
  run:
    shell: bash

jobs:
  cpu:
    # Disable CPU precommit job for now
    if: false
    name: ${{ matrix.scope }}
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: common
            runner: ubuntu-latest
            install: install-common
            test: test-common
            workers: 2
          - scope: openvino
            runner: ubuntu-latest-8-cores
            install: install-openvino
            test: test-openvino
            workers: 4
          - scope: pytorch-cpu
            runner: ubuntu-latest
            install: install-torch
            test: test-torch-cpu
            workers: 2
          - scope: onnx
            runner: ubuntu-latest-8-cores
            install: install-onnx
            test: test-onnx
            workers: 4
          - scope: tools
            runner: ubuntu-latest
            install: install-tools
            test: test-tools
            workers: 1
    env:
      NUM_WORKERS: ${{ matrix.workers }}
    steps:
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Override constraints
        if: ${{ inputs.override_requirements != '' }}
        run: python .github/scripts/override_constraints.py "${{ inputs.override_requirements }}"
        shell: bash
      - name: Install NNCF and test requirements
        run: make ${{ matrix.install }}
      - name: Print installed modules
        run: pip list
      - name: Run precommit test scope
        run: make ${{ matrix.test }}

  pytorch-cuda:
    timeout-minutes: 40
    runs-on: aks-linux-6-cores-55gb-gpu-a10
    if: ${{ inputs.gpu_enabled == true }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run : |
          sudo apt-get update
          sudo apt-get --assume-yes install build-essential ninja-build libgl1-mesa-dev libglib2.0-0 wget make
      - name: Download CUDA
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/13.2.1/local_installers/cuda_13.2.1_595.58.03_linux.run
          sudo sh cuda_13.2.1_595.58.03_linux.run --toolkit --silent
          cuda_home=/usr/local/cuda-13.2
          test -f "$cuda_home/targets/x86_64-linux/lib/libcudart.so.13"
          echo "CUDA_HOME=$cuda_home" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$cuda_home/targets/x86_64-linux/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$cuda_home/bin" >> "$GITHUB_PATH"
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - name: GPU Info
        run: |
          nvidia-smi || echo "no nvidia-smi"
          ls -ls /usr/local/ || echo "no ls"
          nvcc -V || echo "no nvcc"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Override constraints
        if: ${{ inputs.override_requirements != '' }}
        run: python .github/scripts/override_constraints.py "${{ inputs.override_requirements }}"
        shell: bash
      - name: Install NNCF and test requirements
        run: make install-torch
        # env:
        #   UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu126  # TODO(AlexanderDokuchaev): Remove when update ci to use cuda13
        #   UV_INDEX_STRATEGY: unsafe-best-match
      - name: Print installed modules
        run: pip list
      - name: Check CUDA
        run: |
          python -c "import torch; print(torch.cuda.is_available())"
      # - name: Run PyTorch precommit test scope
      #   run: make test-torch-gpu
      #   env:
      #     PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu126  # TODO(AlexanderDokuchaev): Remove when update ci to use cuda13
