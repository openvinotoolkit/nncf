name: call-precommit
permissions: read-all

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version'
        type: string
        required: true
      gpu_enabled:
        description: 'Enable gpu tests'
        type: boolean
        default: false
      override_requirements:
        description: 'Override requirements'
        default: ''
        type: string
        required: false

jobs:

  docker:
    name: Docker
    timeout-minutes: 15
    runs-on: aks-linux-4-cores-16gb-docker-build
    if: ${{ inputs.gpu_enabled == true }}
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
        - /mount:/mount
    outputs:
      images: "${{ steps.handle_docker.outputs.images }}"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: openvinotoolkit/openvino/.github/actions/handle_docker@1f6bb04df50d71dd7e392537eee6b834312f269a
        id: handle_docker
        with:
          images: |
            nncf/pytorch_cuda
          registry: 'openvinogithubactions.azurecr.io'
          dockerfiles_root_dir: '.github/dockerfiles'
          # NNCF does not run Smart CI component detection, so changed_components is
          # hardcoded and the action is never forced to rebuild on Dockerfile changes.
          # Manually bump the tag in .github/dockerfiles/docker_tag whenever a Dockerfile
          # under .github/dockerfiles is changed, otherwise the (now stale) cached image
          # matching the current tag will keep being reused instead of being rebuilt.
          changed_components: '{"docker_env": false, "dockerfiles": false}'

  pytorch-cuda:
    timeout-minutes: 40
    needs: docker
    runs-on:
      group: Nvidia-GPU
      labels: [Linux, NNCF, ov-dmz-24]
    if: ${{ inputs.gpu_enabled == true }}
    container:
      image: ${{ fromJSON(needs.docker.outputs.images).nncf.pytorch_cuda }}
      options: --gpus all --ipc=host
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      GIT_SSL_CAINFO: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      PIP_CERT: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Update CA certificates
        run: update-ca-certificates
      - name: Runner info
        continue-on-error: true
        run: |
          nvidia-smi
          cat /proc/cpuinfo
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
      # - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      #   with:
      #     python-version: ${{ inputs.python_version }}
      # debug
      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # - name: Install uv
      #   uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Override constraints
        if: ${{ inputs.override_requirements != '' }}
        run: python .github/scripts/override_constraints.py "${{ inputs.override_requirements }}"
        shell: bash
      - name: Install NNCF and test requirements
        run: pip install . -r tests/torch/requirements.txt
      - name: Print installed modules
        run: pip list
      - name: Check CUDA
        run: |
          python -c "import torch; print(torch.cuda.is_available())"
      - name: Run PyTorch precommit test scope
        run: |
          pytest -ra --durations=30 tests/torch -m cuda
