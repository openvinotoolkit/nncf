name: call-precommit
permissions: read-all

on:
  workflow_call:
    inputs:
      pr_num:
        description: 'The pull request number'
        type: string
        default: ''
      python_version:
        description: 'Python version'
        type: string
        required: true
      gpu_enabled:
        description: 'Enable gpu tests'
        type: boolean
        default: false
      override_requirements:
        description: 'Override requirements'
        default: ''
        type: string
        required: false

env:
  UV_SYSTEM_PYTHON: 'true'

jobs:
  cpu:
    name: ${{ matrix.scope }}
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: common
            runner: ubuntu-latest
            install: install-common
            test: test-common
            workers: 2
          - scope: openvino
            runner: ubuntu-latest-8-cores
            install: install-openvino
            test: test-openvino
            workers: 4
          - scope: pytorch-cpu
            runner: ubuntu-latest
            install: install-torch
            test: test-torch-cpu
            workers: 2
          - scope: onnx
            runner: ubuntu-latest-8-cores
            install: install-onnx
            test: test-onnx
            workers: 4
          - scope: tools
            runner: ubuntu-latest
            install: install-tools
            test: test-tools
            workers: 1
    defaults:
      run:
        shell: bash
    env:
      NUM_WORKERS: ${{ matrix.workers }}
    steps:
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Override constraints
        if: ${{ inputs.override_requirements != '' && matrix.scope != 'tools' }}
        run: python .github/scripts/override_constraints.py "${{ inputs.override_requirements }}"
        shell: bash
      - name: Install NNCF and test requirements
        run: make ${{ matrix.install }}
      - name: Print installed modules
        run: pip list
      - name: Run precommit test scope
        run: make ${{ matrix.test }}

  pytorch-cuda:
    timeout-minutes: 40
    runs-on: aks-linux-6-cores-55gb-gpu-a10
    if: ${{ inputs.gpu_enabled == true }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run : |
          sudo apt-get update
          sudo apt-get --assume-yes install build-essential ninja-build libgl1-mesa-dev libglib2.0-0 wget make
      - name: Download CUDA
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_560.35.05_linux.run
          sudo sh cuda_12.6.3_560.35.05_linux.run --toolkit --silent
      - name: CPU Info
        run: awk 'BEGIN{RS=""} END{print}' /proc/cpuinfo
      - name: GPU Info
        run: nvidia-smi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          ref: ${{ inputs.pr_num != '' && format('refs/pull/{0}/head', inputs.pr_num) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Override constraints
        if: ${{ inputs.override_requirements != '' }}
        run: python .github/scripts/override_constraints.py "${{ inputs.override_requirements }}"
        shell: bash
      - name: Install NNCF and test requirements
        run: make install-torch
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu126  # TODO(AlexanderDokuchaev): Remove when update ci to use cuda13
          # CMD_INSTALL: uv pip install --index-strategy unsafe-best-match
      - name: Print installed modules
        run: pip list
      - name: Check CUDA
        run: |
          python -c "import torch; print(torch.cuda.is_available())"
      - name: Run PyTorch precommit test scope
        run: make test-torch-gpu
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu126  # TODO(AlexanderDokuchaev): Remove when update ci to use cuda13
